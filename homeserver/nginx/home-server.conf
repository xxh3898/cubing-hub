geo $trusted_tunnel_request {
    default 0;
    172.18.0.0/16 1;
}

map "$trusted_tunnel_request:$http_x_forwarded_proto" $external_scheme {
    "1:http" http;
    "1:https" https;
    default $scheme;
}

map $http_host $external_host {
    "" $host;
    default $http_host;
}

map "$external_scheme" $external_port {
    https 443;
    default $server_port;
}

map $external_scheme $strict_transport_security {
    https "max-age=31536000";
    default "";
}

upstream cubinghub_api {
    server api:8080;
}

server {
    listen 80;
    server_name cubing-hub.com;
    server_tokens off;

    return 308 https://www.cubing-hub.com$request_uri;
}

server {
    listen 80;
    server_name www.cubing-hub.com;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security $strict_transport_security always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    server_name api.cubing-hub.com;
    server_tokens off;

    client_max_body_size 35m;

    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security $strict_transport_security always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    location /api {
        proxy_pass http://cubinghub_api;
        proxy_http_version 1.1;
        proxy_set_header Host $external_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $external_scheme;
        proxy_set_header X-Forwarded-Host $external_host;
        proxy_set_header X-Forwarded-Port $external_port;
    }

    location = /actuator/health {
        proxy_pass http://cubinghub_api;
        proxy_http_version 1.1;
        proxy_set_header Host $external_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $external_scheme;
        proxy_set_header X-Forwarded-Host $external_host;
        proxy_set_header X-Forwarded-Port $external_port;
    }

    location ^~ /actuator/ {
        return 404;
    }

    location /uploads/ {
        alias /data/post-images/;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        return 404;
    }
}
