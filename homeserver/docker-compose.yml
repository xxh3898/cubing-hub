name: cubing-hub

services:
  db:
    image: mysql:8.0.46
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:?DB_NAME must be set}
      MYSQL_USER: ${DB_USERNAME:?DB_USERNAME must be set}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -u root --password="$${MYSQL_ROOT_PASSWORD}" --silent
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - application
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  redis:
    image: redis:7.2.14-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    volumes:
      - redis-data:/data
    networks:
      - application
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  api:
    image: ${API_IMAGE:?API_IMAGE must be set}
    restart: unless-stopped
    init: true
    read_only: true
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=128m,mode=1777
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/${DB_NAME:?DB_NAME must be set}?sslMode=DISABLED&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME must be set}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-1800000}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-604800000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://cubing-hub.com,https://www.cubing-hub.com}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_FLYWAY_ENABLED: "false"
      AUTH_REFRESH_COOKIE_SECURE: "true"
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-true}
      SMTP_STARTTLS_ENABLE: ${SMTP_STARTTLS_ENABLE:-true}
      SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS:-}
      FEEDBACK_DISCORD_WEBHOOK_URL: ${FEEDBACK_DISCORD_WEBHOOK_URL:-}
      RANKING_REDIS_REBUILD_MODE: ${RANKING_REDIS_REBUILD_MODE:-disabled}
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health
      MONITORING_PROMETHEUS_PERMIT_ALL: "false"
      POST_IMAGES_LOCAL_ROOT_PATH: /data/post-images
      POST_IMAGES_KEY_PREFIX: ${POST_IMAGES_KEY_PREFIX:-community/posts}
      POST_IMAGES_PUBLIC_BASE_URL: ${POST_IMAGES_PUBLIC_BASE_URL:-https://api.cubing-hub.com/uploads}
    volumes:
      - type: bind
        source: ${POST_IMAGES_HOST_DIR:?POST_IMAGES_HOST_DIR must be set}
        target: /data/post-images
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - application
      - outbound
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  web:
    image: ${WEB_IMAGE:?WEB_IMAGE must be set}
    restart: unless-stopped
    init: true
    read_only: true
    pids_limit: 100
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /var/cache/nginx:size=32m,mode=0755
      - /var/run:size=4m,mode=0755
      - /tmp:size=16m,mode=1777
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test:
        - CMD-SHELL
        - "wget --header='Host: api.cubing-hub.com' -qO- http://127.0.0.1/actuator/health | grep -q '\"status\":\"UP\"'"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    volumes:
      - type: bind
        source: ${POST_IMAGES_HOST_DIR:?POST_IMAGES_HOST_DIR must be set}
        target: /data/post-images
        read_only: true
      - type: bind
        source: ./nginx/cloudflare-edge-real-ip.conf
        target: /etc/nginx/conf.d/00-cloudflare-real-ip.conf
        read_only: true
    networks:
      application:
      edge:
        aliases:
          - cubing-hub-web
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  mysql-data:
  redis-data:

networks:
  application:
    internal: true
  outbound:
    driver: bridge
  edge:
    external: true
    name: edge
