name: Validate

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - main
  workflow_call:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VITE_API_BASE_URL: https://api.cubing-hub.com

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.classify.outputs.backend }}
      frontend: ${{ steps.classify.outputs.frontend }}
      infrastructure: ${{ steps.classify.outputs.infrastructure }}
      api_image: ${{ steps.classify.outputs.api_image }}
      web_image: ${{ steps.classify.outputs.web_image }}

    steps:
      - name: Check out repository history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -Eeuo pipefail

          if [[ "${REF_NAME}" == "refs/heads/main" ]]; then
            ./scripts/classify-ci-paths.sh \
              ".github/workflows/validate.yml"
            exit 0
          fi

          case "${EVENT_NAME}" in
            pull_request)
              base_sha="${PR_BASE_SHA}"
              ;;
            push)
              base_sha="${BEFORE_SHA}"
              ;;
            *)
              base_sha=""
              ;;
          esac

          if [[ -z "${base_sha}" \
            || "${base_sha}" =~ ^0{40}$ ]] \
            || ! git cat-file -e "${base_sha}^{commit}" 2>/dev/null; then
            ./scripts/classify-ci-paths.sh \
              ".github/workflows/validate.yml"
            exit 0
          fi

          changed_paths_file="$(mktemp "${RUNNER_TEMP}/ci-changed-paths.XXXXXX")"
          trap 'rm -f -- "${changed_paths_file}"' EXIT

          if ! git diff \
              --no-renames \
              --name-only \
              -z \
              "${base_sha}" \
              "${GITHUB_SHA}" \
              >"${changed_paths_file}"; then
            printf '%s\n' 'Failed to detect changed paths.' >&2
            exit 1
          fi

          mapfile -d '' -t changed_paths \
            <"${changed_paths_file}"
          ./scripts/classify-ci-paths.sh "${changed_paths[@]}"

  infrastructure:
    name: Infrastructure checks
    needs:
      - changes
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Fail when change detection fails
        if: needs.changes.result != 'success'
        run: exit 1

      - name: Skip unrelated infrastructure checks
        if: needs.changes.result == 'success' && needs.changes.outputs.infrastructure != 'true'
        run: echo "No infrastructure-related changes."

      - name: Check out repository
        if: needs.changes.result == 'success' && needs.changes.outputs.infrastructure == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Validate shell scripts
        if: needs.changes.result == 'success' && needs.changes.outputs.infrastructure == 'true'
        run: |
          sh -n scripts/classify-ci-paths.sh
          bash -n \
            homeserver/scripts/backup-home-server-bootstrap.sh \
            homeserver/scripts/backup-home-server.sh \
            homeserver/scripts/detect-runtime-config-change.sh \
            homeserver/scripts/deploy-home-server-ci.sh \
            homeserver/scripts/deploy-home-server.sh \
            homeserver/scripts/fixtures/mock-cubing-hub-docker.sh \
            homeserver/scripts/test-backup-home-server.sh \
            homeserver/scripts/test-detect-runtime-config-change.sh \
            homeserver/scripts/test-deploy-home-server.sh \
            homeserver/scripts/test-runtime-script-bootstrap.sh

      - name: Verify runtime config change detection
        if: needs.changes.result == 'success' && needs.changes.outputs.infrastructure == 'true'
        run: |
          current_sha="$(git rev-parse HEAD)"
          test "$(
            /bin/bash ./homeserver/scripts/detect-runtime-config-change.sh \
              "${current_sha}" \
              "${current_sha}" \
              false
          )" = keep
          test "$(
            /bin/bash ./homeserver/scripts/detect-runtime-config-change.sh \
              "${current_sha}" \
              "${current_sha}" \
              true
          )" = update
          /bin/bash ./homeserver/scripts/test-detect-runtime-config-change.sh
          /bin/bash ./homeserver/scripts/test-runtime-script-bootstrap.sh

      - name: Test deploy v2 state transitions
        if: needs.changes.result == 'success' && needs.changes.outputs.infrastructure == 'true'
        run: /bin/bash ./homeserver/scripts/test-deploy-home-server.sh

      - name: Test production backup Compose selection
        if: needs.changes.result == 'success' && needs.changes.outputs.infrastructure == 'true'
        run: /bin/bash ./homeserver/scripts/test-backup-home-server.sh

      - name: Run infrastructure tests
        if: needs.changes.result == 'success' && needs.changes.outputs.infrastructure == 'true'
        run: >
          node --test
          homeserver/scripts/nginx-config.test.mjs
          homeserver/scripts/operations-config.test.mjs
          homeserver/scripts/workflow-config.test.mjs

      - name: Render production Compose
        if: needs.changes.result == 'success' && needs.changes.outputs.infrastructure == 'true'
        run: |
          docker compose \
            --env-file homeserver/.env.example \
            --file homeserver/docker-compose.yml \
            config --quiet

      - name: Build and verify runtime config image
        if: needs.changes.result == 'success' && needs.changes.outputs.infrastructure == 'true'
        run: |
          docker build \
            --file homeserver/runtime-config.Dockerfile \
            --build-arg REVISION=1111111111111111111111111111111111111111 \
            --tag cubing-hub-runtime-config:verify \
            .

          actual_revision="$(
            docker image inspect \
              --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' \
              cubing-hub-runtime-config:verify
          )"
          test "${actual_revision}" = 1111111111111111111111111111111111111111

          container_id="$(docker create cubing-hub-runtime-config:verify)"
          runtime_dir="$(mktemp -d)"

          cleanup_runtime_config() {
            docker rm "${container_id}" >/dev/null 2>&1 || true
            rm -rf -- "${runtime_dir}"
          }
          trap cleanup_runtime_config EXIT INT TERM

          docker cp "${container_id}:/runtime/." "${runtime_dir}"
          test -f "${runtime_dir}/compose.yaml"
          test -f "${runtime_dir}/nginx/cloudflare-edge-real-ip.conf"
          test -x "${runtime_dir}/scripts/deploy-cubing-hub.sh"
          test -x "${runtime_dir}/scripts/backup-cubing-hub.sh"
          test "$(stat -c '%a' "${runtime_dir}/scripts/deploy-cubing-hub.sh")" = 700
          test "$(stat -c '%a' "${runtime_dir}/scripts/backup-cubing-hub.sh")" = 700
          test "$(
            find "${runtime_dir}" -mindepth 1 -printf '%P\n' | LC_ALL=C sort
          )" = "$(
            printf '%s\n' \
              compose.yaml \
              nginx \
              nginx/cloudflare-edge-real-ip.conf \
              scripts \
              scripts/backup-cubing-hub.sh \
              scripts/deploy-cubing-hub.sh
          )"
          bash -n \
            "${runtime_dir}/scripts/deploy-cubing-hub.sh" \
            "${runtime_dir}/scripts/backup-cubing-hub.sh"

          cp homeserver/.env.example "${runtime_dir}/.env"
          API_IMAGE=ghcr.io/xxh3898/cubing-hub-api:1111111111111111111111111111111111111111 \
          WEB_IMAGE=ghcr.io/xxh3898/cubing-hub-web:1111111111111111111111111111111111111111 \
            docker compose \
              --project-directory "${runtime_dir}" \
              --env-file "${runtime_dir}/.env" \
              --file "${runtime_dir}/compose.yaml" \
              config \
              --quiet

          docker compose \
            --env-file homeserver/.env.example \
            --file homeserver/docker-compose.yml \
            --file homeserver/docker-compose.admin.yml \
            --profile admin \
            config --quiet

      - name: Validate Nginx runtime configuration
        if: needs.changes.result == 'success' && needs.changes.outputs.infrastructure == 'true'
        run: |
          docker run --rm \
            --add-host api:127.0.0.1 \
            --volume "${PWD}/homeserver/nginx/home-server.conf:/etc/nginx/conf.d/default.conf:ro" \
            --volume "${PWD}/homeserver/nginx/cloudflare-edge-real-ip.conf:/etc/nginx/conf.d/00-cloudflare-real-ip.conf:ro" \
            nginx:1.27.5-alpine \
            nginx -t

      - name: Validate frontend Dockerfile
        if: needs.changes.result == 'success' && needs.changes.outputs.infrastructure == 'true'
        run: |
          docker build \
            --check \
            --file homeserver/docker/frontend.Dockerfile \
            --build-arg VITE_API_BASE_URL="${VITE_API_BASE_URL}" \
            .

  backend:
    name: Backend checks
    needs:
      - changes
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Fail when change detection fails
        if: needs.changes.result != 'success'
        run: exit 1

      - name: Skip unrelated backend checks
        if: needs.changes.result == 'success' && needs.changes.outputs.backend != 'true'
        run: echo "No backend-related changes."

      - name: Check out repository
        if: needs.changes.result == 'success' && needs.changes.outputs.backend == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Java 17
        if: needs.changes.result == 'success' && needs.changes.outputs.backend == 'true'
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Run backend tests and build
        if: needs.changes.result == 'success' && needs.changes.outputs.backend == 'true'
        working-directory: backend
        env:
          SPRING_PROFILES_ACTIVE: test
        run: ./gradlew test jacocoTestReport build --no-daemon

      - name: Upload backend jar
        if: needs.changes.result == 'success' && needs.changes.outputs.backend == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-jar-${{ github.sha }}
          path: backend/build/libs/cubing-hub-0.0.1-SNAPSHOT.jar
          if-no-files-found: error
          retention-days: 1

      - name: Upload backend reports on failure
        if: needs.changes.result == 'success' && needs.changes.outputs.backend == 'true' && failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-failure-reports-${{ github.sha }}
          path: |
            backend/build/reports/tests/
            backend/build/reports/jacoco/test/
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    name: Frontend checks
    needs:
      - changes
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Fail when change detection fails
        if: needs.changes.result != 'success'
        run: exit 1

      - name: Skip unrelated frontend checks
        if: needs.changes.result == 'success' && needs.changes.outputs.frontend != 'true'
        run: echo "No frontend-related changes."

      - name: Check out repository
        if: needs.changes.result == 'success' && needs.changes.outputs.frontend == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js 20
        if: needs.changes.result == 'success' && needs.changes.outputs.frontend == 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        if: needs.changes.result == 'success' && needs.changes.outputs.frontend == 'true'
        working-directory: frontend
        run: npm ci

      - name: Run frontend lint
        if: needs.changes.result == 'success' && needs.changes.outputs.frontend == 'true'
        working-directory: frontend
        run: npm run lint

      - name: Run frontend tests
        if: needs.changes.result == 'success' && needs.changes.outputs.frontend == 'true'
        working-directory: frontend
        run: npm test -- --run

      - name: Build frontend
        if: needs.changes.result == 'success' && needs.changes.outputs.frontend == 'true'
        working-directory: frontend
        run: npm run build

  api-image:
    name: API ARM64 image
    needs:
      - changes
      - backend
    if: ${{ always() }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15

    steps:
      - name: Fail when change detection fails
        if: needs.changes.result != 'success'
        run: exit 1

      - name: Fail when required backend checks fail
        if: needs.changes.result == 'success' && needs.changes.outputs.api_image == 'true' && needs.backend.result != 'success'
        run: exit 1

      - name: Skip unrelated API image build
        if: needs.changes.result == 'success' && needs.changes.outputs.api_image != 'true'
        run: echo "No API image-related changes."

      - name: Check out repository
        if: needs.changes.result == 'success' && needs.changes.outputs.api_image == 'true' && needs.backend.result == 'success'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Download backend jar
        if: needs.changes.result == 'success' && needs.changes.outputs.api_image == 'true' && needs.backend.result == 'success'
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: backend-jar-${{ github.sha }}
          path: backend/build/libs

      - name: Set up Docker Buildx
        if: needs.changes.result == 'success' && needs.changes.outputs.api_image == 'true' && needs.backend.result == 'success'
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build API ARM64 verification image
        if: needs.changes.result == 'success' && needs.changes.outputs.api_image == 'true' && needs.backend.result == 'success'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: homeserver/docker/backend.Dockerfile
          platforms: linux/arm64
          push: false
          tags: cubing-hub-api:verify
          cache-from: type=gha,scope=cubing-hub-api-arm64
          cache-to: type=gha,mode=max,scope=cubing-hub-api-arm64

  web-image:
    name: Web ARM64 image
    needs:
      - changes
      - frontend
    if: ${{ always() }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15

    steps:
      - name: Fail when change detection fails
        if: needs.changes.result != 'success'
        run: exit 1

      - name: Fail when required frontend checks fail
        if: needs.changes.result == 'success' && needs.changes.outputs.web_image == 'true' && needs.frontend.result != 'success'
        run: exit 1

      - name: Skip unrelated Web image build
        if: needs.changes.result == 'success' && needs.changes.outputs.web_image != 'true'
        run: echo "No Web image-related changes."

      - name: Check out repository
        if: needs.changes.result == 'success' && needs.changes.outputs.web_image == 'true' && needs.frontend.result == 'success'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Docker Buildx
        if: needs.changes.result == 'success' && needs.changes.outputs.web_image == 'true' && needs.frontend.result == 'success'
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build web ARM64 verification image
        if: needs.changes.result == 'success' && needs.changes.outputs.web_image == 'true' && needs.frontend.result == 'success'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: homeserver/docker/frontend.Dockerfile
          platforms: linux/arm64
          push: false
          build-args: |
            VITE_API_BASE_URL=${{ env.VITE_API_BASE_URL }}
          tags: cubing-hub-web:verify
          cache-from: type=gha,scope=cubing-hub-web-arm64
          cache-to: type=gha,mode=max,scope=cubing-hub-web-arm64
