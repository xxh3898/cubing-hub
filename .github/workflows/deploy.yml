name: Publish and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cubing-hub-production
  cancel-in-progress: false

env:
  API_IMAGE_NAME: ghcr.io/xxh3898/cubing-hub-api
  WEB_IMAGE_NAME: ghcr.io/xxh3898/cubing-hub-web
  VITE_API_BASE_URL: https://api.cubing-hub.com

jobs:
  validate:
    name: Validate release
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/validate.yml
    permissions:
      contents: read

  publish:
    name: Publish ARM64 images
    if: github.ref == 'refs/heads/main' && vars.MAC_MINI_DEPLOY_ENABLED == 'true'
    needs:
      - validate
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    permissions:
      actions: read
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Download backend jar
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: backend-jar-${{ github.sha }}
          path: backend/build/libs

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish API ARM64 image
        id: publish-api
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: homeserver/docker/backend.Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ env.API_IMAGE_NAME }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.sha }}
          cache-from: type=gha,scope=cubing-hub-api-arm64
          cache-to: type=gha,mode=max,scope=cubing-hub-api-arm64

      - name: Build and publish web ARM64 image
        id: publish-web
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: homeserver/docker/frontend.Dockerfile
          platforms: linux/arm64
          push: true
          build-args: |
            VITE_API_BASE_URL=${{ env.VITE_API_BASE_URL }}
          tags: ${{ env.WEB_IMAGE_NAME }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.sha }}
          cache-from: type=gha,scope=cubing-hub-web-arm64
          cache-to: type=gha,mode=max,scope=cubing-hub-web-arm64

      - name: Record published images
        env:
          API_IMAGE_DIGEST: ${{ steps.publish-api.outputs.digest }}
          WEB_IMAGE_DIGEST: ${{ steps.publish-web.outputs.digest }}
        run: |
          {
            printf '## Published images\n\n'
            printf -- "- API: \`%s:%s\`\n" "${API_IMAGE_NAME}" "${GITHUB_SHA}"
            printf -- "  - Digest: \`%s\`\n" "${API_IMAGE_DIGEST}"
            printf -- "- Web: \`%s:%s\`\n" "${WEB_IMAGE_NAME}" "${GITHUB_SHA}"
            printf -- "  - Digest: \`%s\`\n" "${WEB_IMAGE_DIGEST}"
          } >>"${GITHUB_STEP_SUMMARY}"

  deploy:
    name: Deploy to home-mini
    if: github.ref == 'refs/heads/main' && vars.MAC_MINI_DEPLOY_ENABLED == 'true'
    needs:
      - publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    permissions:
      packages: read
      id-token: write

    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci
          hostname: cubing-hub-deploy-${{ github.run_id }}-${{ github.run_attempt }}
          ping: home-mini

      - name: Configure restricted SSH identity
        env:
          HOME_MINI_SSH_KEY: ${{ secrets.HOME_MINI_SSH_KEY }}
          HOME_MINI_KNOWN_HOSTS: ${{ secrets.HOME_MINI_KNOWN_HOSTS }}
        run: |
          test -n "${HOME_MINI_SSH_KEY}"
          test -n "${HOME_MINI_KNOWN_HOSTS}"

          umask 077
          mkdir -p "${HOME}/.ssh"
          printf '%s\n' "${HOME_MINI_SSH_KEY}" >"${HOME}/.ssh/id_ed25519_home_mini_ci"
          printf '%s\n' "${HOME_MINI_KNOWN_HOSTS}" >"${HOME}/.ssh/known_hosts"

          ssh-keygen -y -f "${HOME}/.ssh/id_ed25519_home_mini_ci" >/dev/null
          ssh-keygen -lf "${HOME}/.ssh/known_hosts" >/dev/null

      - name: Deploy published images
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "${GHCR_TOKEN}" \
            | ssh \
                -F /dev/null \
                -i "${HOME}/.ssh/id_ed25519_home_mini_ci" \
                -o BatchMode=yes \
                -o IdentitiesOnly=yes \
                -o StrictHostKeyChecking=yes \
                homeserver@home-mini \
                "deploy-cubing-hub ${GITHUB_SHA} ${GITHUB_ACTOR}"
