name: Bug report
description: 재현 가능한 defect, regression 또는 운영 버그를 기록합니다.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        재현 가능한 사실과 영향 범위를 간결하게 기록합니다. token, password, production secret을 첨부하지 않습니다.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: 어떤 문제가 발생하는지 적습니다.
      placeholder: 로그인한 사용자가 기록을 삭제한 뒤 현재 페이지가 갱신되지 않습니다.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: 재현에 필요한 최소 단계와 입력을 적습니다.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: 정상 동작을 적습니다.
    validations:
      required: true

  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual behavior
      description: 실제 결과와 사용자 영향을 적습니다.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment / context
      description: browser, device, branch, commit, API 상태 등 재현에 필요한 context를 적습니다.

  - type: textarea
    id: evidence
    attributes:
      label: Relevant logs or evidence
      description: 필요한 로그, screenshot, CI run 또는 request/response 요약을 적습니다. 민감정보, token, password, production secret은 첨부하지 않습니다.

  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: 사용자, data, security, production 또는 release에 미치는 영향을 적습니다.

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria
      description: 해결 완료를 판단할 수 있는 조건을 적습니다.
      placeholder: |
        - [ ] ...
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: 관련 Issue, PR, Source of Truth 또는 추가 정보를 적습니다.
